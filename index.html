<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLN - Brand Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0A0A0A;
  color: #FFFFFF;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 40px 24px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
.wrapper {
  max-width: 560px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 40px;
}
.logo {
  color: #B08D57;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 0.35em;
  margin-bottom: 8px;
}
.tagline {
  font-size: 14px;
  color: #888888;
  font-weight: 400;
}
.card {
  background: #111111;
  border: 1px solid #2A2A2A;
  border-radius: 12px;
  padding: 32px;
}
.card-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 6px;
}
.card-subtitle {
  font-size: 14px;
  color: #888888;
  line-height: 1.5;
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: #AAAAAA;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: #111111;
  border: 1px solid #2A2A2A;
  border-radius: 8px;
  padding: 13px;
  color: #FFFFFF;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s ease;
}
.form-group input::placeholder {
  color: #555555;
}
.form-group input:focus {
  border-color: #B08D57;
}
.form-group input:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.submit-btn {
  width: 100%;
  background: #B08D57;
  color: #0A0A0A;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 8px;
  padding: 14px;
  cursor: pointer;
  margin-top: 8px;
  transition: opacity 0.2s ease;
}
.submit-btn:hover {
  opacity: 0.9;
}
.submit-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}
.helper-text {
  font-size: 13px;
  color: #666666;
  line-height: 1.5;
  text-align: center;
  margin-top: 20px;
}
.success-state {
  display: none;
  text-align: center;
  padding: 24px 0;
}
.success-state .checkmark {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: #B08D57;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
}
.success-state .checkmark svg {
  width: 28px;
  height: 28px;
}
.success-state h3 {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 8px;
}
.success-state p {
  font-size: 14px;
  color: #888888;
  line-height: 1.5;
}
.footer {
  text-align: center;
  margin-top: 40px;
  font-size: 13px;
  color: #555555;
}
.footer a {
  color: #555555;
  text-decoration: none;
}
.footer a:hover {
  color: #B08D57;
}
@media (max-width: 540px) {
  .card { padding: 24px; }
  .logo { font-size: 26px; }
}
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="logo">ALLN</div>
    <div class="tagline">Brand Intelligence Platform</div>
  </div>

  <div class="card">
    <div id="formSection">
      <h2 class="card-title">Set up your brand</h2>
      <p class="card-subtitle">Tell us about your brand and we will do the rest.</p>

      <form id="setupForm">
        <div class="form-group">
          <label>Brand Name</label>
          <input type="text" id="brandName" placeholder="e.g. Gymshark" required>
        </div>
        <div class="form-group">
          <label>Website URL</label>
          <input type="text" id="websiteUrl" placeholder="e.g. gymshark.com" required>
        </div>
        <div class="form-group">
          <label>Primary Social Handle</label>
          <input type="text" id="socialHandle" placeholder="@yourbrand" required>
        </div>
        <button type="submit" class="submit-btn" id="submitBtn">Discover My Brand</button>
      </form>

      <p class="helper-text">ALLN will automatically discover your hashtags, community, competitors, and ambassadors in minutes.</p>
    </div>

    <div class="success-state" id="successState">
      <div class="checkmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h3>Discovery started.</h3>
      <p>Check your email for your brand intelligence report.</p>
    </div>
  </div>

  <div class="footer">
    <a href="mailto:mark@allnhq.com">mark@allnhq.com</a>
  </div>
</div>

<script>
(function() {
  // Init Shopify App Bridge
  var AppBridge = window['app-bridge'];
  if (AppBridge && AppBridge.createApp) {
    AppBridge.createApp({
      apiKey: 'cd1c255e9e36048061e356ea657aec73',
      host: new URLSearchParams(window.location.search).get('host')
    });
  }

  var form = document.getElementById('setupForm');
  var btn = document.getElementById('submitBtn');
  var formSection = document.getElementById('formSection');
  var successState = document.getElementById('successState');
  var inputs = form.querySelectorAll('input');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var brandName = document.getElementById('brandName').value;
    var websiteUrl = document.getElementById('websiteUrl').value;
    var socialHandle = document.getElementById('socialHandle').value;

    btn.disabled = true;
    btn.textContent = 'Discovering...';
    for (var i = 0; i < inputs.length; i++) {
      inputs[i].disabled = true;
    }

    // POST to webhook
    fetch('https://build.twin.so/triggers/alln-preview-form-submission/webhook', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        brand_name: brandName,
        website_url: websiteUrl,
        social_handle: socialHandle
      })
    }).catch(function() {});

    // After 3 seconds show success
    setTimeout(function() {
      formSection.style.display = 'none';
      successState.style.display = 'block';
    }, 3000);
  });
})();
</script>
</body>
</html>
